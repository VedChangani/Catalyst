spring.config.import=optional:file:.env[.properties]
# DB_URL overrides the local default. (A spring.datasource.url line in the root .env also still
# wins, because imported .env entries take precedence.)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billing_app}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api/v1.0

aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}

jwt.secret.key=${JWT_SECRET_KEY}

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Developer-provisioned initial ADMIN (see AdminBootstrap). Off unless explicitly enabled; there
# are no default credentials. Only creates an admin when none exists - never modifies one.
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.name=${APP_ADMIN_NAME:}
app.admin.bootstrap.email=${APP_ADMIN_EMAIL:}
app.admin.bootstrap.mobile=${APP_ADMIN_MOBILE:}
app.admin.bootstrap.password=${APP_ADMIN_PASSWORD:}

# Frontend origin(s) allowed by CORS, comma-separated, explicit only ("*" is rejected at startup
# because credentials are allowed).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Directory uploaded images are written to and served from (relative to the working directory).
app.uploads.dir=${APP_UPLOADS_DIR:uploads}

# Public base URL under which uploaded item/category images are served (the /uploads/** route of
# this API). Stored into imgUrl when an image is uploaded.
app.uploads.public-base-url=${APP_UPLOADS_PUBLIC_BASE_URL:http://localhost:8080/api/v1.0/uploads}

# Money is BigDecimal: always write it as a plain JSON number (never 1E+1 notation).
spring.jackson.generator.write-bigdecimal-as-plain=true

# ---- Outgoing mail (SMTP, provider-agnostic; used for password-reset codes) ----
# Everything comes from the environment / root .env; nothing is hard-coded. With MAIL_HOST unset the
# app still starts (local dev) but sends no mail - production ("prod" profile) refuses to start
# without it (see PasswordResetConfigValidator). Never turn SMTP debug on: it prints message bodies,
# i.e. the one-time codes.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# ---- Customer forgot-password / OTP reset ----
# Dedicated HMAC key for the stored one-time-code hashes. Required (startup fails when blank or
# shorter than 32 characters) and deliberately NOT the JWT secret.
app.password-reset.otp-secret=${APP_PASSWORD_RESET_OTP_SECRET:}
app.password-reset.otp-ttl=10m
app.password-reset.max-attempts=5
app.password-reset.resend-cooldown=60s
app.password-reset.max-sends-per-hour=5
# From address, e.g. "Catalyst <no-reply@your-domain>". Required in production.
app.password-reset.mail-from=${APP_MAIL_FROM:}
# Per-IP fixed-window limits for the public request/reset endpoints. In-memory and instance-local
# (NOT a distributed limiter); the per-account limits in the database are authoritative.
app.password-reset.ip-window=15m
app.password-reset.request-ip-limit=10
app.password-reset.reset-ip-limit=20
# true ONLY behind a reverse proxy that appends the real client address to X-Forwarded-For
# (the bundled nginx does). Off by default so a client-supplied header can never pick its own IP.
app.password-reset.trust-forwarded-for=${APP_TRUST_FORWARDED_FOR:false}
