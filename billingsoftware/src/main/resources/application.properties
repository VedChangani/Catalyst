spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billing_app}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api/v1.0

aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}

jwt.secret.key=${JWT_SECRET_KEY}

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.name=${APP_ADMIN_NAME:}
app.admin.bootstrap.email=${APP_ADMIN_EMAIL:}
app.admin.bootstrap.mobile=${APP_ADMIN_MOBILE:}
app.admin.bootstrap.password=${APP_ADMIN_PASSWORD:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.uploads.dir=${APP_UPLOADS_DIR:uploads}

app.uploads.public-base-url=${APP_UPLOADS_PUBLIC_BASE_URL:http://localhost:8080/api/v1.0/uploads}

spring.jackson.generator.write-bigdecimal-as-plain=true
