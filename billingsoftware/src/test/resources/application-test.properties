# "test" Spring profile - only active when a test explicitly opts in via @ActiveProfiles("test")
# (see BillingsoftwareApplicationTests). It never applies to the production/dev run, which keeps
# using src/main/resources/application.properties and the real MySQL datasource unchanged.
# It exists purely so a @SpringBootTest can boot a full ApplicationContext without a local MySQL
# server; nothing here reaches a real database, AWS account, JWT secret, or Razorpay account -
# the values below are inert placeholders, not real credentials.

spring.datasource.url=jdbc:h2:mem:billing_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

server.servlet.context-path=/api/v1.0

# Inert placeholders so @Value-injected fields (AWSConfig, JwtUtil, RazorpayServiceImpl) resolve
# at context startup - none of them make a network call during bean creation.
aws.access.key=test-access-key
aws.secret.key=test-secret-key
aws.region=us-east-1
aws.bucket.name=test-bucket

jwt.secret.key=test-only-jwt-secret-not-for-production-use

razorpay.key.id=test-razorpay-key-id
razorpay.key.secret=test-razorpay-key-secret

# Uploaded images written by tests go to a throwaway directory inside the build output (removed by
# `mvn clean`, git-ignored) - never into the real uploads/ folder.
app.uploads.dir=target/test-uploads

# Inert OTP HMAC key (>= 32 chars) so the context starts; no mail host is set, so no mail is sent.
app.password-reset.otp-secret=test-only-otp-hmac-secret-0123456789-not-for-production
